<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - Pelajar Cilik</title>
    <!-- Menghubungkan file HTML dengan file CSS untuk mendesain tampilan -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- Kotak utama untuk kartu profil -->
        <div class="kartu-profil">
            <!-- Menampilkan foto profil -->
            <img src="foto-profil.jpg" alt="Foto profil saya">
            
            <!-- Nama lengkap pemilik profil -->
            <h1>Moh. Hafiz Ashfahani Saputra</h1>
            
            <!-- Deskripsi singkat -->
            <p>Siswa SMA yang rajin dan tidak sombong rajin menabung</p>
            
            <!-- Tautan menuju halaman Instagram atau hadiah -->
            <a href="https://www.instagram.com/usernameanda">Tekan untuk mendapatkan hadiah</a>
            
            <!-- Tombol interaktif (ID disamakan dengan JavaScript: sapaButton) -->
            <button id="sapaButton">Sapa Gw</button>
        </div>

  <!-- Menghubungkan file HTML dengan file JavaScript untuk interaksi tombol -->
  <script src="script.js"></script>
</body>
</html>
